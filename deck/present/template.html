<title>Life at the Top · Ascent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=National+Park:wght@400;700&family=Nothing+You+Could+Do&display=swap">
<style>
  /* Layout: one 1920x1080 stage scaled to fit; slides stacked, revealed by a rising gradient. */
  :root {
    --void: #05090c;      /* letterbox around the stage */
    --ink: #0e1c26;       /* deck dark ground */
    --paper: #f4f1ea;     /* deck light ground */
    --glow: #e9733f;      /* alpenglow accent */
    --mist: #c9d6db;      /* chrome text */
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--void); color: var(--mist); overflow: hidden; touch-action: pan-y; }
  #frame { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage { position: relative; width: 1920px; height: 1080px; flex: none; transform-origin: 50% 50%; overflow: hidden; background: var(--ink); }

  /* --- emulation of the deck renderer's defaults --- */
  #stage section { position: absolute; inset: 0; width: 1920px; height: 1080px; box-sizing: border-box;
    display: flex; flex-direction: column; overflow: hidden; visibility: hidden;
    font-family: Barlow, Arial, sans-serif; color: #eef2f1; will-change: transform, mask-position; }
  #stage section * { box-sizing: border-box; margin: 0; }
  #stage section > * { position: relative; }
  #stage section div { display: flex; flex-direction: column; }
  #stage section img { display: block; object-fit: cover; max-width: none; }
  #stage section svg { display: block; flex: none; }
  #stage section h1 { font-size: 96px; font-weight: 600; line-height: 1.1; }
  #stage section h2 { font-size: 64px; font-weight: 600; line-height: 1.15; }
  #stage section h3 { font-size: 44px; font-weight: 600; line-height: 1.2; }
  #stage section p  { font-size: 32px; line-height: 1.4; }
  #stage section.on { visibility: visible; }

  /* the drifting band of mist that rides the transition edge */
  #mist { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 5; }

  /* chrome */
  .chip { position: fixed; z-index: 20; font: 500 13px/1 var(--mono); letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--mist); background: rgba(14, 28, 38, .72); border: 1px solid rgba(201, 214, 219, .18);
    padding: 10px 14px; border-radius: 999px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity .6s ease; }
  #hint { left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); white-space: nowrap; }
  #hint.gone, #tools.gone { opacity: 0; }
  #tools:focus-within { opacity: 1; }
  #tools { right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; padding: 6px; }
  #tools button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; background: none; border: 0; padding: 6px 10px; border-radius: 999px; cursor: pointer; }
  #tools button:hover, #tools button[aria-pressed="true"] { background: rgba(233, 115, 63, .22); color: #fff; }
  #tools button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  #notes { position: fixed; z-index: 19; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(64px + env(safe-area-inset-bottom, 0px)); max-width: 880px; margin: 0 auto; max-height: 38vh; overflow: auto;
    background: rgba(10, 22, 30, .94); border: 1px solid rgba(201, 214, 219, .2); border-radius: 14px; padding: 18px 22px;
    font: 400 17px/1.55 Barlow, Arial, sans-serif; color: #e6edef; white-space: pre-line; }
  #notes b { display: block; font: 500 12px/1.4 var(--mono); letter-spacing: 2px; color: var(--glow); margin-bottom: 6px; }
  @media (max-width: 560px) { #hint { font-size: 11px; } }
</style>

<div id="frame"><div id="stage">
<!--SLIDES-->
<div id="mist"></div>
</div></div>

<div id="tools" class="chip" role="toolbar" aria-label="Presentation controls">
  <button id="prev" type="button" aria-label="Previous slide">◀</button>
  <span id="count" aria-live="polite" style="padding:6px 4px">01 / 11</span>
  <button id="next" type="button" aria-label="Next slide">▶</button>
  <button id="notesBtn" type="button" aria-pressed="false">Notas</button>
  <button id="fsBtn" type="button">Tela cheia</button>
</div>
<div id="hint" class="chip">← → ou toque para avançar · N notas · F tela cheia</div>
<div id="notes" hidden></div>

<script>
(() => {
  const NOTES = /*NOTES*/[];
  const BASES = /*BASES*/[];
  const stage = document.getElementById('stage');
  const slides = [...stage.querySelectorAll('section[data-i]')];
  const mist = document.getElementById('mist');
  const count = document.getElementById('count');
  const notesBox = document.getElementById('notes');
  const notesBtn = document.getElementById('notesBtn');
  const N = slides.length;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');

  // ---------- scale the 1920x1080 stage to the window ----------
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${s})`;
    stage.style.margin = `${(innerHeight - 1080) / 2}px ${(innerWidth - 1920) / 2}px`;
  }
  addEventListener('resize', fit); fit();

  // ---------- colour helpers ----------
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // easeInOutCubic
  const lum = c => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;

  function setMask(el, value) { el.style.webkitMaskImage = value; el.style.maskImage = value; }
  function clear(el) { setMask(el, ''); el.style.transform = ''; el.style.opacity = ''; el.style.filter = ''; el.style.zIndex = ''; }

  // ---------- the transition ----------
  // The next slide climbs in from below (backwards: drops in from above) through a soft
  // gradient mask. A band of mist, tinted halfway between the two grounds, rides the edge
  // so a dark slide never snaps to a light one. The bigger the jump in brightness,
  // the wider the feather and the longer the move.
  let cur = 0, anim = null;

  function show(i) {
    slides.forEach((s, k) => { s.classList.toggle('on', k === i); clear(s); });
    mist.style.opacity = 0;
    cur = i;
    count.textContent = `${String(i + 1).padStart(2, '0')} / ${N}`;
    notesBox.innerHTML = `<b>NOTAS · SLIDE ${i + 1}</b>` + escapeHtml(NOTES[i] || '');
    try { history.replaceState(null, '', '#slide-' + (i + 1)); } catch (e) {}
  }

  function go(to) {
    to = Math.max(0, Math.min(N - 1, to));
    if (to === cur && !anim) return;
    if (anim) { cancelAnimationFrame(anim.raf); anim.done(); }
    if (to === cur) return;
    const from = cur, dir = to > from ? 1 : -1;
    const a = slides[from], b = slides[to];
    const ca = hex(BASES[from]), cb = hex(BASES[to]);
    const jump = Math.abs(lum(ca) - lum(cb));                 // 0 (same ground) .. ~0.85 (dark <-> paper)
    const F = 0.32 + jump * 0.38;                              // feather, as a share of the slide height
    const dur = reduce.matches ? 260 : 950 + jump * 650;
    const mid = mix(ca, cb, 0.5);

    b.classList.add('on'); a.classList.add('on');
    a.style.zIndex = 1; b.style.zIndex = 2;
    const side = dir > 0 ? 'to top' : 'to bottom';
    const t0 = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - t0) / dur), e = ease(t);
      if (reduce.matches) {
        b.style.opacity = e;
      } else {
        // edge of the reveal travels from -F to 1 (share of the height)
        const edge = -F + e * (1 + F);
        const solid = (edge * 100).toFixed(2), clearAt = ((edge + F) * 100).toFixed(2);
        setMask(b, `linear-gradient(${side}, #000 ${solid}%, transparent ${clearAt}%)`);
        b.style.transform = `translateY(${(dir * 36 * (1 - e)).toFixed(2)}px)`;
        a.style.transform = `translateY(${(-dir * 22 * e).toFixed(2)}px)`;
        a.style.filter = `brightness(${(1 - 0.18 * Math.sin(Math.PI * e) * jump).toFixed(3)})`;
        // mist: transparent / tinted / transparent, centred on the feather
        const peak = 0.62 * Math.sin(Math.PI * t) * (0.35 + jump);
        const m0 = ((edge - 0.08) * 100).toFixed(2), m1 = ((edge + F / 2) * 100).toFixed(2), m2 = ((edge + F + 0.08) * 100).toFixed(2);
        mist.style.background = `linear-gradient(${side}, ${rgba(mid, 0)} ${m0}%, ${rgba(mid, peak)} ${m1}%, ${rgba(mid, 0)} ${m2}%)`;
        mist.style.opacity = 1;
      }
      if (t < 1) anim.raf = requestAnimationFrame(frame); else anim.done();
    }
    anim = { raf: 0, done: () => { anim = null; show(to); } };
    anim.raf = requestAnimationFrame(frame);
    cur = to;
    count.textContent = `${String(to + 1).padStart(2, '0')} / ${N}`;
  }

  function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  // ---------- input ----------
  const next = () => go((anim ? cur : cur) + 1), prev = () => go(cur - 1);
  document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); next(); });
  document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  notesBtn.addEventListener('click', e => { e.stopPropagation(); toggleNotes(); });
  document.getElementById('fsBtn').addEventListener('click', e => { e.stopPropagation(); toggleFs(); });
  notesBox.addEventListener('click', e => e.stopPropagation());

  function toggleNotes() { notesBox.hidden = !notesBox.hidden; notesBtn.setAttribute('aria-pressed', String(!notesBox.hidden)); }
  function toggleFs() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  }

  addEventListener('keydown', e => {
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(N - 1);
    else if (e.key === 'n' || e.key === 'N') toggleNotes();
    else if (e.key === 'f' || e.key === 'F') toggleFs();
  });
  document.getElementById('frame').addEventListener('click', e => { (e.clientX < innerWidth / 3 ? prev : next)(); });
  let tx = null, ty = null;
  addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { (dx < 0 ? next : prev)(); }
    tx = null;
  });
  setTimeout(() => document.getElementById('hint').classList.add('gone'), 4500);
  // the control pill hides while presenting and comes back when the pointer moves
  const tools = document.getElementById('tools'); let idle;
  function wake() { tools.classList.remove('gone'); clearTimeout(idle); idle = setTimeout(() => { if (notesBox.hidden) tools.classList.add('gone'); }, 3000); }
  addEventListener('pointermove', wake); addEventListener('keydown', wake); wake();

  // ---------- start ----------
  const m = /^#slide-(\d+)$/.exec(location.hash);
  show(m ? Math.max(0, Math.min(N - 1, +m[1] - 1)) : 0);
  addEventListener('hashchange', () => {
    const h = /^#slide-(\d+)$/.exec(location.hash);
    if (h && +h[1] - 1 !== cur) go(+h[1] - 1);
  });
})();
</script>
