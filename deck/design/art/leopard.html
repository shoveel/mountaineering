<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do&family=Barlow:wght@400;500&display=swap">
<style>
  html,body{margin:0;width:1920px;height:984px;background:#0e1c26;overflow:hidden}
  svg{display:block}
  .hand{font-family:'Nothing You Could Do',cursive;font-size:42px}
  .body{font-family:'Barlow',sans-serif;font-size:29px}
</style></head>
<body>
<svg id="s" width="1920" height="984" viewBox="0 0 1920 984" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const NS='http://www.w3.org/2000/svg',S=document.getElementById('s');
const el=(t,a,p=S)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const INK='#0e1c26',GLOW='#e9733f';
const t=(x,y,s,cls,fill,anchor='start')=>{const e=el('text',{x,y,class:cls,fill,['text-anchor']:anchor});e.textContent=s;return e};
const defs=el('defs',{});
for(let i=1;i<16;i++){let d='';for(let j=0;j<=90;j++){const a=j/90*Math.PI*2;const r=i*44*(1+0.07*Math.sin(3*a+i*.5)+0.05*Math.sin(5*a));d+=(j?'L':'M')+(1600+r*1.25*Math.cos(a)).toFixed(1)+' '+(560+r*Math.sin(a)).toFixed(1)}el('path',{d:d+'Z',fill:'none',stroke:'#8fbccb',['stroke-width']:i%5?1:2,opacity:.08})}
// framed photo, same treatment as the condor plate
// source 1080x1918; show the band y 360..1760 (head to paws) in a 584x757 frame
const X=650,Y=146,W=584,s=W/1080,H=Math.round(1400*s);
const cp=el('clipPath',{id:'c'},defs);el('rect',{x:X,y:Y,width:W,height:H,rx:18},cp);
el('image',{href:'snow-leopard-portrait.jpg',x:X,y:Y-360*s,width:1080*s,height:1918*s,['clip-path']:'url(#c)'});
el('rect',{x:X,y:Y,width:W,height:H,rx:18,fill:'none',stroke:'#eef2f1',['stroke-width']:2,opacity:.25});
const P=(x,y)=>[X+x*s,Y+(y-360)*s];
const notes=[
  {pt:P(517,742),y:206,head:'big nose & lungs',body:'warm icy air, take in oxygen'},
  {pt:P(390,1040),y:366,head:'thick fur',body:'up to 12 cm long on its belly'},
  {pt:P(640,1180),y:526,head:'spotted grey coat',body:'camouflage on rocks and snow'},
  {pt:P(930,1420),y:686,head:'very long tail',body:'about 1 m: balance + a scarf'},
  {pt:P(330,1545),y:846,head:'snowshoe paws',body:'wide and furry, so it won’t sink'},
];
notes.forEach(n=>{
  const [x,y]=n.pt,lx=1300;
  const d=`M${x} ${y} L${lx-34} ${n.y-12} L${lx-10} ${n.y-12}`;
  el('path',{d,fill:'none',stroke:INK,['stroke-width']:6,opacity:.55,['stroke-linejoin']:'round'});
  el('path',{d,fill:'none',stroke:'#f4f1ea',['stroke-width']:2,['stroke-linejoin']:'round'});
  el('circle',{cx:x,cy:y,r:11,fill:'none',stroke:GLOW,['stroke-width']:3});
  el('circle',{cx:x,cy:y,r:4,fill:GLOW});
  t(lx,n.y,n.head,'hand',GLOW);
  t(lx,n.y+42,n.body,'body','#d6e0e3');
});
</script>
</body></html>
